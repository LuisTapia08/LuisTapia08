name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push:
    branches: ["main"]
    # Só roda no push quando o próprio workflow mudar (editar o README não dispara mais)
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LuisTapia08
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Manaus
          # Inclui repositórios de organizações e onde você é colaborador
          repositories_affiliations: owner, collaborator, organization_member
          repositories: 100
          # Busca os repositórios em lotes menores (lote de 100 dava timeout na API e carregava 0 repositórios)
          repositories_batch: 10
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          # Analisa só os seus commits (clona os repositórios)
          plugin_languages_indepth: yes
          # Tempo máximo total da análise (minutos)
          plugin_languages_analysis_timeout: 30
          # Tempo máximo por repositório (minutos) — evita que um repo grande consuma todo o tempo
          plugin_languages_analysis_timeout_repositories: 15
          # Ignora TeX (documentos LaTeX, não é código)
          plugin_languages_ignored: tex
          # TEMPORÁRIO: log detalhado para ver quais repositórios a análise de linguagens processa
          debug: yes
          # E-mail dos commits (inclusive nos repos das organizações)
          commits_authoring: LuisTapia08, luitapia307@gmail.com
